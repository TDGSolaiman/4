<html lang="nl">
<head>

<style>

*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);font-family:Roboto,"Segoe UI",Arial,sans-serif;color:var(--tx)}
main{display:flex;height:100%;gap:0}

canvas{height:100%;max-width:100%;aspect-ratio:9/16;object-fit:contain;border-radius:10px}

h2{font-size:15px;margin:18px 0 8px;font-weight:700}
h2:first-child{margin-top:0}
.row{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;font-size:13px;font-weight:600;color:var(--tx);background:transparent;border:1px solid var(--ln);border-radius:8px;padding:7px 11px;cursor:pointer}
button:hover{border-color:var(--ac)}
button.main{background:var(--ac);color:#1b1206;border-color:var(--ac)}
button:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
label.s{display:block;font-size:13px;margin:10px 0 0}
label.s span{float:right;color:var(--mu);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--ac);margin:4px 0 0}
.sw{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
input[type=color]{width:100%;height:34px;padding:0;border:1px solid var(--ln);border-radius:8px;background:none;cursor:pointer}
.cl{display:flex;align-items:center;gap:10px;font-size:13px;margin-top:8px}
.cl input{width:44px;flex:none}
@media (max-width:820px){main{flex-direction:column;height:auto}#stage{height:100vh;flex:none}aside{width:100%;border-left:0;border-top:1px solid var(--ln)}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
</head>
<body>
<main>
<div id="stage"><canvas id="c" width="720" height="1280"></canvas></div>
<aside id="p">
<h2>Controls</h2>
<div class="row">
<button class="main" id="bRestart">Restart</button>
<button id="bPause">Pause</button>
<button id="bSound">Sound: ON</button>
<button id="bRecord" style="color:#ff5555">⏺ Start Recording</button>
</div>
<h2>Ball Colors</h2>
<div class="sw" id="sw"></div>
<div class="row" style="margin-top:8px" id="presets"></div>
<div class="cl"><input type="color" id="cFirst"><span>First Ball</span></div>
<div class="cl"><input type="color" id="cPend"><span>Pendulum Ball</span></div>
<div class="cl"><input type="color" id="cAcc"><span>Title Color</span></div>
<h2>Theme</h2><div class="row" id="th"></div><h2>Settings</h2>
<div id="sl"></div>
</aside>
</main>

multi([['Will it ','#f4f5fa'],['OVERFLOW?',acc]],158,'700 56px Roboto,Arial,sans-serif');

/* ---------- loop ---------- */
let last=performance.now();

$('bPause').onclick=e=>{paused=!paused;e.target.textContent=paused?'Verder':'Pauze'};

// ---------- automatic recording ----------
let recorder, recordedChunks=[], recording=false;

$('bRecord').onclick=()=>{
    if(recording){
        stopRecording();
        return;
    }

    initAudio();

    // Sound ON
    on=true;
    master.gain.value=S.vol;
    $('bSound').textContent='Sound: ON';

    // Restart simulation
    restart();
    paused=false;
    $('bPause').textContent='Pauze';

    const videoStream=C.captureStream(60);
    const tracks=[
        ...videoStream.getVideoTracks(),
        ...recAudio.stream.getAudioTracks()
    ];

    const stream=new MediaStream(tracks);
    recordedChunks=[];

    recorder=new MediaRecorder(stream);
    recording=true;

    recorder.ondataavailable=e=>{
        if(e.data.size>0) recordedChunks.push(e.data);
    };

    recorder.onstop=()=>{
        const blob=new Blob(recordedChunks,{
            type:recorder.mimeType||'video/webm'
        });

        const url=URL.createObjectURL(blob);
        const a=document.createElement('a');

        a.href=url;
        a.download='Will-it-overflow-'+Date.now()+'.webm';
        a.click();

        setTimeout(()=>URL.revokeObjectURL(url),1500);

        stream.getTracks().forEach(track=>track.stop());

        // Sound OFF
        on=false;
        master.gain.value=0;
        $('bSound').textContent='Sound: OFF';

        recording=false;

        const btn=$('bRecord');
        btn.textContent='⏺ Start Recording';
        btn.style.background='';
        btn.style.color='#ff5555';
    };

    recorder.start();

    const btn=$('bRecord');
    btn.textContent='⏹ Opname bezig...';
    btn.style.background='#d92d20';
    btn.style.color='#ffffff';

    monitorRecording();
};

function stopRecording(){
    if(recorder && recorder.state==='recording'){
        recorder.stop();
    }
}

function monitorRecording(){
    if(!recording) return;

    if(over && overT>=2.5){
        stopRecording();
        return;
    }

    requestAnimationFrame(monitorRecording);
}
addEventListener('pointerdown',()=>{if(!ac){initAudio();on=true;master.gain.value=S.vol;$('bSound').textContent='Sound: ON'}},{once:true});
